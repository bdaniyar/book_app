<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password reset</title>
    <style>
        /* Basic, email-client friendly styles */
        body {
            margin: 0;
            padding: 0;
            background: #f6f7fb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        .container {
            width: 100%;
            padding: 24px 12px;
        }

        .card {
            max-width: 560px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e7e9f0;
            border-radius: 14px;
            overflow: hidden;
        }

        .header {
            padding: 20px 22px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
        }

        .header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .content {
            padding: 22px;
            color: #111827;
        }

        .content p {
            margin: 0 0 14px;
            font-size: 14px;
            line-height: 1.5;
        }

        .button-wrap {
            margin: 18px 0 10px;
        }

        .btn {
            display: inline-block;
            background: #4f46e5;
            color: #fff !important;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
        }

        .muted {
            color: #6b7280;
            font-size: 12px;
        }

        .link {
            word-break: break-all;
            color: #4f46e5;
        }

        .footer {
            padding: 16px 22px;
            background: #fafafa;
            border-top: 1px solid #eef0f6;
            color: #6b7280;
            font-size: 12px;
        }

        code {
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Reset your password</h1>
            </div>
            <div class="content">
                <p>We received a request to reset your password.</p>
                <p class="button-wrap">
                    <a class="btn" href="{{ reset_link }}" target="_blank" rel="noopener noreferrer">Reset password</a>
                </p>
                <p class="muted">If the button doesn't work, copy and paste this link into your browser:</p>
                <p><a class="link" href="{{ reset_link }}" target="_blank" rel="noopener noreferrer">{{ reset_link
                        }}</a></p>
                <p class="muted">If you didn't request this, you can safely ignore this email.</p>
            </div>
            <div class="footer">
                <div>Book App • Password reset</div>
            </div>
        </div>
    </div>
</body>

</html>
