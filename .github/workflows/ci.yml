name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: book_app
          POSTGRES_PASSWORD: book_app
          POSTGRES_DB: book_app_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U book_app -d book_app_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://book_app:book_app@localhost:5432/book_app_ci
      TEST_DATABASE_URL: postgresql+psycopg://book_app:book_app@localhost:5432/book_app_test
      JWT_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      AI_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: psql -h localhost -U book_app -d postgres -c 'CREATE DATABASE book_app_test'
        env:
          PGPASSWORD: book_app
      - run: alembic upgrade head
      - run: pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
